version: "3.3"
services:
  # One image, one service per app. The command names the entry point — nothing is selected at
  # runtime, and each app keeps its own state file under the shared volume.
  app-oracle-solana:
    image: galacticcouncil/broadcaster:latest
    command: [node, oracle-solana/app.js]
    environment:
      - PRIVKEY= # base58 secret key
      - RPC_SOLANA=
      - REFRESH_INTERVAL=
      - CHANGE_THRESHOLD=
    volumes:
      - db:/app/.db
    configs:
      - source: thresholds
        target: /app/thresholds.json
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  app-oracle-ethereum:
    image: galacticcouncil/broadcaster:latest
    command: [node, oracle-ethereum/app.js]
    environment:
      - PRIVKEY= # 0x-prefixed hex key
      - RPC_ETHEREUM=
      - REFRESH_INTERVAL=
      - CHANGE_THRESHOLD=
    volumes:
      - db:/app/.db
    configs:
      - source: thresholds
        target: /app/thresholds.json
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

networks:
  default:
    driver: overlay
volumes:
  db:
    driver: local
configs:
  thresholds:
    external: true
    name: whm_broadcaster_thresholds
