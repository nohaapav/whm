version: '3.3'
services:
  hydration:
    image: galacticcouncil/mrelayer:latest
    command:
      - start:hydration
    environment:
      HYDRATION_RPC: https://hydration-rpc.n.dwellir.com
      NTT_BASE_FROM_SEQ: '0'
      NTT_ETH_FROM_SEQ: '0'
      NTT_SOLANA_FROM_SEQ: '0'
      NTT_SUI_FROM_SEQ: '0'
      PRIVKEY: FILL THIS KEY ALWAYS
      REDIS_HOST: redis
      SPY_ENDPOINT: spy:7073
      WORMHOLE_API_KEY: MAYBE FILL THIS KEY OR REMOVE IT
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: 'true'
  intent:
    image: galacticcouncil/mrelayer:latest
    command:
      - start:intent
    environment:
      ETH_RPC: https://eth.llamarpc.com
      HYDRATION_FROM_SEQ: '0'
      HYDRATION_RPC: https://hydration-rpc.n.dwellir.com
      INTENT_EMITTER: FILL THIS ADDRESS # IntentEmitter on Hydration
      INTENT_PRIVKEY: FILL THIS KEY ALWAYS
      INTENT_RECEIVER: FILL THIS ADDRESS # IntentReceiver on Ethereum
      NTT_TRANSCEIVER: FILL THIS ADDRESS # WormholeTransceiver (WETH) on Hydration
      QUOTER_URL: http://quoter:8080 # reachable quoter service (deployed separately)
      REDIS_HOST: redis
      SPY_ENDPOINT: spy:7073
      WORMHOLE_API_KEY: MAYBE FILL THIS KEY OR REMOVE IT
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: 'true'
  redis:
    image: redis:latest
    volumes:
      - db22:/data
    networks:
      - default
    logging:
      driver: json-file
  spy:
    image: ghcr.io/wormhole-foundation/guardiand:latest
    command:
      - spy
      - --nodeKey
      - /node.key
      - --spyRPC
      - '[::]:7073'
      - --network
      - /wormhole/mainnet/2
      - --bootstrap
      - /dns4/wormhole-v2-mainnet-bootstrap.xlabs.xyz/udp/8999/quic/p2p/12D3KooWNQ9tVrcb64tw6bNs2CaNrUGPM7yRrKvBBheQ5yCyPHKC,/dns4/wormhole.mcf.rocks/udp/8999/quic/p2p/12D3KooWDZVv7BhZ8yFLkarNdaSWaB43D6UbQwExJ8nnGAEmfHcU,/dns4/wormhole-v2-mainnet-bootstrap.staking.fund/udp/8999/quic/p2p/12D3KooWG8obDX9DNi1KUwZNu9xkGwfKqTp2GFwuuHpWZ3nQruS1
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 1000m
networks:
  default:
    driver: overlay
volumes:
  db22:
    driver: local
