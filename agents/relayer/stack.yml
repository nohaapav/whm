version: '3.3'
services:
  # One image, three services. A feature runs when its signing key is present, so each container
  # enables exactly one — and each keeps its own engine namespace, hence its own Redis state.
  hydration-ntt:
    image: galacticcouncil/relayer:latest
    environment:
      # APP_NAME is LOAD-BEARING: every Redis key derives from it. Renaming orphans the queue and
      # the missed-VAA cursors, and the worker then rescans from NTT_*_FROM_SEQ.
      APP_NAME: hydration-ntt-relayer
      HYDRATION_RPC: https://rpc.hydradx.cloud
      NTT_BASE_FROM_SEQ: '0'
      NTT_ETH_FROM_SEQ: '0'
      NTT_SOLANA_FROM_SEQ: '0'
      NTT_SUI_FROM_SEQ: '0'
      PRIVKEY: FILL THIS KEY ALWAYS
      REDIS_HOST: redis
      SPY_ENDPOINT: spy:7073
      WORMHOLE_API_KEY: MAYBE FILL THIS KEY OR REMOVE IT
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: 'true'

  intent:
    image: galacticcouncil/relayer:latest
    environment:
      # INTENT_APP_NAME is LOAD-BEARING — see the note above.
      INTENT_APP_NAME: intent-relayer
      ETH_RPC: https://ethereum-rpc.publicnode.com
      HYDRATION_FROM_SEQ: '0'
      HYDRATION_RPC: https://rpc.hydradx.cloud
      INTENT_EMITTER: FILL THIS ADDRESS # IntentEmitter on Hydration
      INTENT_PRIVKEY: FILL THIS KEY ALWAYS # reimbursed wallet, separate from PRIVKEY
      INTENT_RECEIVER: FILL THIS ADDRESS # IntentReceiver on Ethereum
      NTT_TRANSCEIVER: '0x8acce9CA511d5D7213F8C3f813B8916087cd00ae' # WETH transceiver on Hydration
      QUOTER_URL: http://quoter:8080 # reachable quoter service (deployed separately)
      REDIS_HOST: redis
      SPY_ENDPOINT: spy:7073
      WORMHOLE_API_KEY: MAYBE FILL THIS KEY OR REMOVE IT
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: 'true'

  oracle:
    image: galacticcouncil/relayer:latest
    environment:
      # ORACLE_APP_NAME is LOAD-BEARING — see the note above.
      ORACLE_APP_NAME: oracle-relayer
      HYDRATION_RPC: https://rpc.hydradx.cloud
      # 0x-prefixed. Writes to the receivers; separate from PRIVKEY so the two do not share a nonce.
      ORACLE_PRIVKEY: FILL THIS KEY ALWAYS
      ORACLE_SOLANA_FROM_SEQ: '0'
      ORACLE_ETH_FROM_SEQ: '0'
      REDIS_HOST: redis
      SPY_ENDPOINT: spy:7073
      WORMHOLE_API_KEY: MAYBE FILL THIS KEY OR REMOVE IT
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: 'true'

  redis:
    image: redis:latest
    volumes:
      - db22:/data
    networks:
      - default
    logging:
      driver: json-file

  spy:
    image: ghcr.io/wormhole-foundation/guardiand:latest
    command:
      - spy
      - --nodeKey
      - /node.key
      - --spyRPC
      - '[::]:7073'
      - --network
      - /wormhole/mainnet/2
      - --bootstrap
      - /dns4/wormhole-v2-mainnet-bootstrap.xlabs.xyz/udp/8999/quic/p2p/12D3KooWNQ9tVrcb64tw6bNs2CaNrUGPM7yRrKvBBheQ5yCyPHKC,/dns4/wormhole.mcf.rocks/udp/8999/quic/p2p/12D3KooWDZVv7BhZ8yFLkarNdaSWaB43D6UbQwExJ8nnGAEmfHcU,/dns4/wormhole-v2-mainnet-bootstrap.staking.fund/udp/8999/quic/p2p/12D3KooWG8obDX9DNi1KUwZNu9xkGwfKqTp2GFwuuHpWZ3nQruS1
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: 1000m

networks:
  default:
    driver: overlay

volumes:
  # Reuses the existing volume: the engine namespaces are unchanged, so the queue and the
  # missed-VAA cursors carry straight over from mrelayer.
  db22:
    driver: local
