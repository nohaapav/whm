version: "3.3"
services:
  app-intents:
    image: galacticcouncil/scan:latest
    command: [node, intents/app.js]
    environment:
      - DATABASE_URL=postgres://scan:scan@postgres:5432/scan
      # Asset symbols are read from Hydration once at boot; nothing else here touches a chain.
      - RPC_HYDRATION_WSS=
      # The off-chain leg. Without it an order stops at `processed` and never resolves.
      - ONECLICK_JWT=
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  app-basejump:
    image: galacticcouncil/scan:latest
    command: [node, basejump/app.js]
    environment:
      - DATABASE_URL=postgres://scan:scan@postgres:5432/scan
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  # One image, one service per domain. The command names the entry point — nothing is selected at
  # runtime. Only ingest writes to `events`, `wh_messages` and `ntt_transfers`; the rest read them.
  #
  # What to index — chain ids, contract addresses, start blocks — is code, in src/chains.ts and
  # src/watch.ts. Only endpoints and secrets are set here.
  ingest:
    image: galacticcouncil/scan:latest
    command: [node, ingest/app.js]
    environment:
      # EVM RPCs must be websocket: heads arrive over eth_subscribe, never by polling.
      - RPC_ETHEREUM_WSS=
      # Hydration MUST be the substrate path — the landing's deliveries are XCM-driven pallet_evm
      # calls with no eth receipt, so only Frontier EVM.Log substrate events expose them.
      - RPC_HYDRATION_WSS=
      - DATABASE_URL=postgres://scan:scan@postgres:5432/scan
    depends_on:
      - postgres
    networks:
      - default
    logging:
      driver: json-file
    deploy:
      labels:
        swarmpit.service.deployment.autoredeploy: "true"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=scan
      - POSTGRES_PASSWORD=scan
      - POSTGRES_DB=scan
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    logging:
      driver: json-file

networks:
  default:
    driver: overlay

volumes:
  pgdata:
    driver: local
