<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Transfer · Hydration basejump</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap" id="main">
      <div class="panel"><div class="table-error">loading…</div></div>
    </main>

    <script type="module">
      import {
        addrLink,
        amount,
        badge,
        esc,
        json,
        kv,
        legCard,
        live,
        topbar,
      } from "/shared/app.js";

      topbar("basejump");

      // Also answers the bare `/transfers`, which has nothing to show — the list is the root.
      const id = decodeURIComponent(location.pathname.split("/")[2] ?? "");
      if (!id) location.replace("/");

      const main = document.getElementById("main");
      const mono = (v) => (v ? esc(v) : '<span class="dim">—</span>');

      /**
       * The route, start to end.
       *
       * The fast path is the point: the payout leaves the landing pool long before the settlement
       * that replenishes it arrives, and the fee is what buys that head start. A shortfall turns
       * the middle hop into a queue, which is where a transfer visibly stalls.
       */
      function route(t) {
        const startedAt = t.initiated?.blockTimestamp;
        const wasQueued = !!t.queued;
        return [
          legCard({
            where: t.source_chain ?? "source",
            kind: "initiated",
            ref: t.initiated,
            rows: [
              [
                "",
                `<span class="mono">${amount(t.gross_amount, 18, 6)}</span>`,
              ],
            ],
          }),
          wasQueued
            ? legCard({
                where: t.dest_chain ?? "hydration",
                kind: "queued",
                ref: t.queued,
                held: !t.fulfilled,
                rows: [["", '<span class="dim">landing pool was short</span>']],
                since: startedAt,
              })
            : legCard({
                where: t.dest_chain ?? "hydration",
                kind: "paid out",
                ref: t.completed,
                rows: [
                  [
                    "",
                    `<span class="mono">${amount(t.net_amount, 18, 6)}</span>`,
                  ],
                ],
                since: startedAt,
              }),
          wasQueued
            ? legCard({
                where: t.dest_chain ?? "hydration",
                kind: "fulfilled",
                ref: t.fulfilled,
                rows: [
                  [
                    "",
                    `<span class="mono">${amount(t.net_amount, 18, 6)}</span>`,
                  ],
                ],
                since: startedAt,
              })
            : "",
        ]
          .filter(Boolean)
          .join("");
      }

      function render(t) {
        if (!t) {
          main.innerHTML = `<div class="panel"><div class="table-error">no transfer ${esc(id)}</div></div>`;
          return;
        }

        const detail = [
          kv(
            "route",
            `<span class="dim">${esc(t.source_chain ?? "?")} →</span> ${esc(t.dest_chain ?? "…")}`,
          ),
          kv("sender", addrLink(t.sender, t.source_chain)),
          kv("recipient", addrLink(t.recipient, t.dest_chain)),
          kv("source asset", addrLink(t.source_asset, t.source_chain)),
          kv("destination asset", addrLink(t.dest_asset, t.dest_chain)),
          kv("id", mono(t.id)),
        ].join("");

        // Gross is what left the source; the fee buys the head start, and the rest is paid out of
        // the landing pool before the settlement replenishing it has arrived.
        const amounts = [
          kv(
            "gross",
            `<span class="mono">${amount(t.gross_amount, 18, 8)}</span>`,
          ),
          kv("fee", `<span class="mono">${amount(t.fee, 18, 8)}</span>`),
          kv(
            "paid out",
            `<span class="mono">${amount(t.net_amount, 18, 8)}</span>`,
          ),
        ].join("");

        const settlement = [
          kv("ntt sequence", mono(t.transfer_sequence)),
          kv("message sequence", mono(t.message_sequence)),
          kv("pending queue id", mono(t.pending_id)),
        ].join("");

        main.innerHTML = `
          <h1 class="page-title">Transfer <span class="sub">${badge(t.state)}</span></h1>
          <div class="legs">${route(t)}</div>
          <div class="panel">
            <div class="panel-head"><span class="t">Transfer</span></div>
            ${detail}
          </div>
          <div class="panel">
            <div class="panel-head"><span class="t">Amounts</span><span class="note">paid out ahead of settlement</span></div>
            ${amounts}
          </div>
          <div class="panel">
            <div class="panel-head"><span class="t">Settlement</span></div>
            ${settlement}
          </div>`;
      }

      async function load() {
        render(await json(`/api/transfers/${encodeURIComponent(id)}`));
      }

      live(
        "transfers",
        (u) => {
          if (u.record?.id === id) load();
        },
        load,
      );
      load();
    </script>
  </body>
</html>
