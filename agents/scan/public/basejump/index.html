<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hydration basejump</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 class="page-title">
        Transfers <span class="sub" id="subtitle"></span>
      </h1>

      <div class="bar">
        <input type="search" id="q" placeholder="sender or recipient" />
        <select id="state">
          <option value="">any state</option>
          <option value="initiated">initiated</option>
          <option value="completed">completed</option>
          <option value="queued">queued</option>
          <option value="fulfilled">fulfilled</option>
        </select>
      </div>

      <div class="panel">
        <div class="scroll">
          <table class="tbl">
            <thead>
              <tr>
                <th>Time</th>
                <th>Route</th>
                <th>From</th>
                <th>To</th>
                <th>Assets</th>
                <th class="r">Fee</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td class="table-error" colspan="7">loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pager">
          <span class="count" id="count"></span>
          <div class="btns">
            <button id="prev" type="button" title="Newer">←</button>
            <button id="next" type="button" title="Older">→</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import {
        addrLink,
        ago,
        amount,
        at,
        badge,
        esc,
        json,
        live,
        topbar,
      } from "/shared/app.js";

      topbar("basejump");

      const LIMIT = 50;
      let offset = 0;
      const el = (id) => document.getElementById(id);

      /** Source chain to landing. A transfer with no delivery yet has only half a route. */
      function route(r) {
        return `<span class="dim">${esc(r.source_chain ?? "?")} →</span> ${esc(r.dest_chain ?? "…")}`;
      }

      /** What left the source and what was actually paid out of the landing pool. */
      function assets(r) {
        return `<span class="assets"><span class="mono">${amount(r.gross_amount, 18, 4)}</span><span class="arrow">→</span><span class="mono">${amount(r.net_amount, 18, 4)}</span></span>`;
      }

      function render(items) {
        if (!items.length) {
          el("rows").innerHTML =
            '<tr><td class="table-error" colspan="7">no transfers</td></tr>';
          return;
        }
        el("rows").innerHTML = items
          .map((r) => {
            const ts = r.initiated?.blockTimestamp;
            const href = `/transfers/${encodeURIComponent(r.id)}`;
            return `<tr class="clickable" data-href="${href}">
              <td data-label="Time" title="${at(ts)}"><a class="link" href="${href}">${ago(ts)}</a></td>
              <td data-label="Route">${route(r)}</td>
              <td class="mono" data-label="From">${addrLink(r.sender, r.source_chain)}</td>
              <td class="mono" data-label="To">${addrLink(r.recipient, r.dest_chain)}</td>
              <td data-label="Assets">${assets(r)}</td>
              <td class="r mono" data-label="Fee">${amount(r.fee, 18, 4)}</td>
              <td data-label="Status">${badge(r.state)}</td>
            </tr>`;
          })
          .join("");
      }

      el("rows").addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        const href = e.target.closest("tr")?.dataset.href;
        if (href) location.href = href;
      });

      async function load() {
        const params = new URLSearchParams({ limit: LIMIT, offset });
        const q = el("q").value.trim();
        const state = el("state").value;
        if (q) params.set("address", q);
        if (state) params.set("state", state);

        const data = (await json(`/api/transfers?${params}`)) ?? {
          items: [],
          total: 0,
        };
        render(data.items);
        const from = data.total ? offset + 1 : 0;
        el("count").textContent =
          `${from}–${Math.min(offset + LIMIT, data.total)} of ${data.total}`;
        el("prev").disabled = offset === 0;
        el("next").disabled = offset + LIMIT >= data.total;
      }

      async function loadSummary() {
        const s = await json("/api/status");
        if (!s) return;
        el("subtitle").textContent = Object.entries(s.flows?.transfers ?? {})
          .filter(([, n]) => n > 0)
          .map(([k, n]) => `${n} ${k}`)
          .join(" · ");
      }

      el("prev").onclick = () => {
        offset = Math.max(0, offset - LIMIT);
        load();
      };
      el("next").onclick = () => {
        offset += LIMIT;
        load();
      };
      el("state").onchange = () => {
        offset = 0;
        load();
      };
      let typing;
      el("q").oninput = () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          offset = 0;
          load();
        }, 250);
      };

      live(
        "transfers",
        () => {
          if (offset === 0) load();
          loadSummary();
        },
        () => {
          load();
          loadSummary();
        },
      );

      load();
      loadSummary();
      setInterval(loadSummary, 15000);
    </script>
  </body>
</html>
