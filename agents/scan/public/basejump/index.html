<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Basejump · scan</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="topbar">
      <span class="brand"><svg class="logo" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M18.0532 11.3604C18.2827 11.1319 18.5778 10.8381 18.8718 10.5463C19.5265 9.89543 19.5265 8.83853 18.8718 8.18664L18.1782 7.49598C15.6959 9.96786 11.982 10.4637 9.00484 8.98646C11.017 9.35678 13.1028 9.06807 14.951 8.0785C16.1876 7.41641 16.4222 5.74741 15.4295 4.75886L11.3366 0.683262C10.4217 -0.227754 8.93928 -0.227754 8.02542 0.683262L3.61392 5.07613C6.51941 3.84682 10.0089 4.4171 12.3714 6.78594C8.76716 5.04349 4.30136 5.66171 1.3088 8.64164C1.07931 8.87016 0.78323 9.16499 0.490223 9.45676C-0.163408 10.1086 -0.163408 11.1645 0.490223 11.8154L1.18279 12.505C3.66515 10.0332 7.37896 9.53735 10.3562 11.0146C8.34404 10.6442 6.25816 10.933 4.40996 11.9225C3.17339 12.5846 2.93878 14.2536 3.93152 15.2422L8.0244 19.3178C8.93928 20.2288 10.4217 20.2288 11.3356 19.3178L15.7471 14.9249C12.8416 16.1542 9.35215 15.5839 6.98965 13.2151C10.5938 14.9575 15.0596 14.3393 18.0522 11.3594L18.0532 11.3604Z"></path></svg>scan <span class="domain">/ basejump</span></span>
      <span class="spacer"></span>
      <span class="conn"><span class="dot"></span><span class="label">connecting</span></span>
      <button class="theme" type="button" title="Toggle theme"></button>
    </div>

    <main>
      <div class="stats" id="stats"></div>

      <div class="bar">
        <input type="search" id="q" placeholder="sender or recipient" />
        <select id="state">
          <option value="">any state</option>
          <option value="initiated">initiated</option>
          <option value="completed">completed</option>
          <option value="queued">queued</option>
          <option value="fulfilled">fulfilled</option>
        </select>
        <span class="spacer"></span>
        <span class="muted" id="count"></span>
        <button class="page" id="prev" type="button">←</button>
        <button class="page" id="next" type="button">→</button>
      </div>

      <div class="panel">
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Transfer</th>
                <th>State</th>
                <th>Route</th>
                <th>Sender</th>
                <th>Recipient</th>
                <th class="num">Gross</th>
                <th class="num">Fee</th>
                <th class="num">Paid out</th>
                <th class="num">Age</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td class="empty" colspan="9">loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module">
      import { ago, amount, at, badge, esc, json, live, short, theme } from "/shared/app.js";

      theme.init();

      const LIMIT = 50;
      let offset = 0;
      const el = (id) => document.getElementById(id);

      /** Source chain to landing. A row with no delivery yet has only half a route. */
      function route(r) {
        const to = r.dest_chain ? esc(r.dest_chain) : '<span class="dim">…</span>';
        return `<span class="dim">${esc(r.source_chain ?? "?")} →</span> ${to}`;
      }

      function render(items) {
        if (!items.length) {
          el("rows").innerHTML = '<tr><td class="empty" colspan="9">no transfers</td></tr>';
          return;
        }
        el("rows").innerHTML = items
          .map((r) => {
            const ts = r.initiated?.blockTimestamp;
            return `<tr>
              <td class="mono"><a href="/transfers/${encodeURIComponent(r.id)}">${esc(short(r.id, 14, 6))}</a></td>
              <td>${badge(r.state)}</td>
              <td>${route(r)}</td>
              <td class="mono">${esc(short(r.sender, 6, 4))}</td>
              <td class="mono">${esc(short(r.recipient, 8, 6))}</td>
              <td class="num mono">${amount(r.gross_amount, 18, 6)}</td>
              <td class="num mono">${amount(r.fee, 18, 6)}</td>
              <td class="num mono">${amount(r.net_amount, 18, 6)}</td>
              <td class="num dim" title="${at(ts)}">${ago(ts)}</td>
            </tr>`;
          })
          .join("");
      }

      async function load() {
        const params = new URLSearchParams({ limit: LIMIT, offset });
        const q = el("q").value.trim();
        const state = el("state").value;
        if (q) params.set("address", q);
        if (state) params.set("state", state);

        const data = (await json(`/api/transfers?${params}`)) ?? { items: [], total: 0 };
        render(data.items);
        const from = data.total ? offset + 1 : 0;
        el("count").textContent = `${from}–${Math.min(offset + LIMIT, data.total)} of ${data.total}`;
        el("prev").disabled = offset === 0;
        el("next").disabled = offset + LIMIT >= data.total;
      }

      async function loadStats() {
        const s = await json("/api/status");
        if (!s) return;
        el("stats").innerHTML = Object.entries(s.flows?.transfers ?? {})
          .map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`)
          .join("");
      }

      el("prev").onclick = () => {
        offset = Math.max(0, offset - LIMIT);
        load();
      };
      el("next").onclick = () => {
        offset += LIMIT;
        load();
      };
      el("state").onchange = () => {
        offset = 0;
        load();
      };
      let typing;
      el("q").oninput = () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          offset = 0;
          load();
        }, 250);
      };

      live("transfers", () => {
        if (offset === 0) load();
        loadStats();
      });

      load();
      loadStats();
      setInterval(loadStats, 15000);
    </script>
  </body>
</html>
