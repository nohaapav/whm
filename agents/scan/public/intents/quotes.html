<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quotes · scan</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="topbar">
      <span class="brand"><svg class="logo" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M18.0532 11.3604C18.2827 11.1319 18.5778 10.8381 18.8718 10.5463C19.5265 9.89543 19.5265 8.83853 18.8718 8.18664L18.1782 7.49598C15.6959 9.96786 11.982 10.4637 9.00484 8.98646C11.017 9.35678 13.1028 9.06807 14.951 8.0785C16.1876 7.41641 16.4222 5.74741 15.4295 4.75886L11.3366 0.683262C10.4217 -0.227754 8.93928 -0.227754 8.02542 0.683262L3.61392 5.07613C6.51941 3.84682 10.0089 4.4171 12.3714 6.78594C8.76716 5.04349 4.30136 5.66171 1.3088 8.64164C1.07931 8.87016 0.78323 9.16499 0.490223 9.45676C-0.163408 10.1086 -0.163408 11.1645 0.490223 11.8154L1.18279 12.505C3.66515 10.0332 7.37896 9.53735 10.3562 11.0146C8.34404 10.6442 6.25816 10.933 4.40996 11.9225C3.17339 12.5846 2.93878 14.2536 3.93152 15.2422L8.0244 19.3178C8.93928 20.2288 10.4217 20.2288 11.3356 19.3178L15.7471 14.9249C12.8416 16.1542 9.35215 15.5839 6.98965 13.2151C10.5938 14.9575 15.0596 14.3393 18.0522 11.3594L18.0532 11.3604Z"></path></svg>scan <span class="domain">/ intents</span></span>
      <nav>
        <a href="/">Orders</a>
        <a href="/quotes" aria-current="page">Quotes</a>
      </nav>
      <span class="spacer"></span>
      <span class="conn"><span class="dot"></span><span class="label">connecting</span></span>
      <button class="theme" type="button" title="Toggle theme"></button>
    </div>

    <main id="main">
      <div class="panel"><div class="empty">loading…</div></div>
    </main>

    <script type="module">
      import { ago, at, esc, json, live, short, theme, txLink } from "/shared/app.js";

      theme.init();

      // One page, both paths: `/quotes` lists, `/quotes/<authPath>` shows one.
      const authPath = decodeURIComponent(location.pathname.split("/")[2] ?? "");
      const main = document.getElementById("main");
      const row = (k, v) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`;
      const mono = (v) => (v ? `<span class="mono">${esc(v)}</span>` : '<span class="dim">—</span>');

      /**
       * A standing authorization is terms, not a transaction: whoever paid to publish it holds no
       * authority over it, because the account is derived from the terms themselves.
       */
      function renderOne(q) {
        if (!q) {
          main.innerHTML = `<div class="panel"><div class="empty">no quote at ${esc(authPath)}</div></div>`;
          return;
        }
        const ref = q.published;
        main.innerHTML = `
          <div class="panel">
            <header><h2>Quote</h2><span class="muted">standing authorization</span></header>
            <dl>
              ${row("Derivation path", mono(q.auth_path))}
              ${row("Quote id", mono(q.quote_id))}
              ${row("Recipient", mono(q.recipient))}
              ${row("Publisher", mono(q.publisher))}
              ${row("Message sequence", mono(q.message_sequence))}
              ${row("Published", ref ? `${txLink(ref)} <span class="dim" title="${at(ref.blockTimestamp)}">· ${ago(ref.blockTimestamp)} ago</span>` : '<span class="dim">—</span>')}
            </dl>
          </div>`;
      }

      function renderList(data) {
        const rows = (data?.items ?? [])
          .map((q) => {
            const ts = q.published?.blockTimestamp;
            return `<tr>
              <td class="mono"><a href="/quotes/${esc(q.auth_path)}">${esc(short(q.auth_path, 10, 6))}</a></td>
              <td class="mono">${esc(short(q.quote_id, 10, 6))}</td>
              <td class="mono">${esc(q.recipient ?? "—")}</td>
              <td class="mono">${esc(short(q.publisher, 6, 4))}</td>
              <td class="num dim" title="${at(ts)}">${ago(ts)}</td>
            </tr>`;
          })
          .join("");

        main.innerHTML = `
          <div class="panel">
            <header><h2>Quotes</h2><span class="muted">${data?.total ?? 0} published</span></header>
            <div class="scroll">
              <table>
                <thead>
                  <tr>
                    <th>Derivation path</th><th>Quote id</th><th>Recipient</th><th>Publisher</th><th class="num">Age</th>
                  </tr>
                </thead>
                <tbody>${rows || '<tr><td class="empty" colspan="5">no quotes published yet</td></tr>'}</tbody>
              </table>
            </div>
          </div>`;
      }

      async function load() {
        if (authPath) renderOne(await json(`/api/quotes/${encodeURIComponent(authPath)}`));
        else renderList(await json("/api/quotes?limit=100"));
      }

      live("quotes", load);
      load();
    </script>
  </body>
</html>
