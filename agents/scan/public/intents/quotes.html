<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Quotes · Hydration intents</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap" id="main">
      <div class="panel"><div class="table-error">loading…</div></div>
    </main>

    <script type="module">
      import {
        addrLink,
        ago,
        at,
        esc,
        eventLink,
        json,
        kv,
        live,
        short,
        topbar,
      } from "/shared/app.js";

      topbar("intents", [
        ["/", "Orders"],
        ["/quotes", "Quotes"],
      ]);

      // One page, both paths: `/quotes` lists, `/quotes/<authPath>` shows one.
      const authPath = decodeURIComponent(
        location.pathname.split("/")[2] ?? "",
      );
      const main = document.getElementById("main");
      const mono = (v) => (v ? esc(v) : '<span class="dim">—</span>');

      /**
       * A standing authorization is terms, not a transaction. Whoever paid to publish it holds no
       * authority over it — the NEAR account is derived from the terms themselves, so the
       * derivation path is the identity and the publisher is a footnote.
       */
      function renderOne(q) {
        if (!q) {
          main.innerHTML = `<div class="panel"><div class="table-error">no quote at ${esc(authPath)}</div></div>`;
          return;
        }
        main.innerHTML = `
          <h1 class="page-title">Quote <span class="sub">${esc(short(q.auth_path, 10, 8))}</span></h1>
          <div class="panel">
            <div class="panel-head"><span class="t">Standing authorization</span></div>
            ${kv("derivation path", mono(q.auth_path))}
            ${kv("quote id", mono(q.quote_id))}
            ${kv("recipient", mono(q.recipient))}
            ${kv("publisher", addrLink(q.publisher, "hydration"))}
            ${kv("message sequence", mono(q.message_sequence))}
            ${kv("published", eventLink(q.published))}
          </div>`;
      }

      function renderList(data) {
        const rows = (data?.items ?? [])
          .map((q) => {
            const ts = q.published?.blockTimestamp;
            const href = `/quotes/${encodeURIComponent(q.auth_path)}`;
            return `<tr class="clickable" data-href="${href}">
              <td class="mono" data-label="Path"><a class="link" href="${href}">${esc(short(q.auth_path, 10, 6))}</a></td>
              <td class="mono" data-label="Quote id">${esc(short(q.quote_id, 10, 6))}</td>
              <td class="mono" data-label="Recipient">${esc(q.recipient ?? "—")}</td>
              <td class="mono" data-label="Publisher">${addrLink(q.publisher, "hydration")}</td>
              <td data-label="Time" title="${at(ts)}">${ago(ts)}</td>
            </tr>`;
          })
          .join("");

        main.innerHTML = `
          <h1 class="page-title">Quotes <span class="sub">${data?.total ?? 0} published</span></h1>
          <div class="panel">
            <div class="scroll">
              <table class="tbl">
                <thead>
                  <tr>
                    <th>Path</th><th>Quote id</th><th>Recipient</th><th>Publisher</th><th>Time</th>
                  </tr>
                </thead>
                <tbody>${rows || '<tr><td class="table-error" colspan="5">no quotes published yet</td></tr>'}</tbody>
              </table>
            </div>
          </div>`;

        main.querySelector("tbody")?.addEventListener("click", (e) => {
          if (e.target.closest("a")) return;
          const href = e.target.closest("tr")?.dataset.href;
          if (href) location.href = href;
        });
      }

      async function load() {
        if (authPath)
          renderOne(await json(`/api/quotes/${encodeURIComponent(authPath)}`));
        else renderList(await json("/api/quotes?limit=100"));
      }

      live("quotes", load, load);
      load();
    </script>
  </body>
</html>
