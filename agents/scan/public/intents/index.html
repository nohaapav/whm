<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Intents · scan</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <div class="topbar">
      <span class="brand"><svg class="logo" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M18.0532 11.3604C18.2827 11.1319 18.5778 10.8381 18.8718 10.5463C19.5265 9.89543 19.5265 8.83853 18.8718 8.18664L18.1782 7.49598C15.6959 9.96786 11.982 10.4637 9.00484 8.98646C11.017 9.35678 13.1028 9.06807 14.951 8.0785C16.1876 7.41641 16.4222 5.74741 15.4295 4.75886L11.3366 0.683262C10.4217 -0.227754 8.93928 -0.227754 8.02542 0.683262L3.61392 5.07613C6.51941 3.84682 10.0089 4.4171 12.3714 6.78594C8.76716 5.04349 4.30136 5.66171 1.3088 8.64164C1.07931 8.87016 0.78323 9.16499 0.490223 9.45676C-0.163408 10.1086 -0.163408 11.1645 0.490223 11.8154L1.18279 12.505C3.66515 10.0332 7.37896 9.53735 10.3562 11.0146C8.34404 10.6442 6.25816 10.933 4.40996 11.9225C3.17339 12.5846 2.93878 14.2536 3.93152 15.2422L8.0244 19.3178C8.93928 20.2288 10.4217 20.2288 11.3356 19.3178L15.7471 14.9249C12.8416 16.1542 9.35215 15.5839 6.98965 13.2151C10.5938 14.9575 15.0596 14.3393 18.0522 11.3594L18.0532 11.3604Z"></path></svg>scan <span class="domain">/ intents</span></span>
      <nav>
        <a href="/" aria-current="page">Orders</a>
        <a href="/quotes">Quotes</a>
      </nav>
      <span class="spacer"></span>
      <span class="conn"><span class="dot"></span><span class="label">connecting</span></span>
      <button class="theme" type="button" title="Toggle theme"></button>
    </div>

    <main>
      <div class="stats" id="stats"></div>

      <div class="bar">
        <input type="search" id="q" placeholder="caller, deposit address, or destination recipient" />
        <select id="state">
          <option value="">any state</option>
          <option value="placed">placed</option>
          <option value="processed">processed</option>
          <option value="settled">settled</option>
          <option value="refunded">refunded</option>
          <option value="failed">failed</option>
        </select>
        <span class="spacer"></span>
        <span class="muted" id="count"></span>
        <button class="page" id="prev" type="button">←</button>
        <button class="page" id="next" type="button">→</button>
      </div>

      <div class="panel">
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Seq</th>
                <th>State</th>
                <th>Rail</th>
                <th>Caller</th>
                <th class="num">In</th>
                <th class="num">Out</th>
                <th class="num">Relay fee</th>
                <th>Destination</th>
                <th class="num">Age</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td class="empty" colspan="9">loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module">
      import { ago, amount, at, badge, esc, json, live, short, theme } from "/shared/app.js";

      theme.init();

      const LIMIT = 50;
      let offset = 0;
      let tokens = { hydration: {}, dest: {} };

      const el = (id) => document.getElementById(id);

      /** Format the Hydration asset the caller sold, with its symbol when we know it. */
      function assetIn(row) {
        const meta = tokens.hydration[row.asset_in];
        const value = amount(row.amount_in, meta?.decimals ?? 12, 4);
        return `${value} <span class="dim">${esc(meta?.symbol ?? `#${row.asset_in ?? "?"}`)}</span>`;
      }

      /** Where it lands: 1Click's destination leg, once it knows one. */
      function destination(row) {
        if (!row.dest_address) return '<span class="dim">—</span>';
        const meta = tokens.dest[row.dest_asset];
        const value = row.dest_amount ? amount(row.dest_amount, meta?.decimals ?? 0, 4) : "";
        const label = meta ? `${value} ${esc(meta.symbol)}` : esc(row.dest_asset ?? "");
        return `<span class="mono">${esc(short(row.dest_address, 8, 6))}</span> <span class="dim">${label}</span>`;
      }

      /**
       * The NTT rail underneath the order. `queued` is the one worth shouting about — the inbound
       * rate limiter is holding the settlement and nothing has been credited.
       */
      function rail(row) {
        return row.rail_state ? badge(row.rail_state) : '<span class="dim">—</span>';
      }

      function render(items) {
        if (!items.length) {
          el("rows").innerHTML = '<tr><td class="empty" colspan="9">no orders</td></tr>';
          return;
        }
        el("rows").innerHTML = items
          .map((r) => {
            const ts = r.placed?.blockTimestamp;
            return `<tr>
              <td class="mono"><a href="/orders/${esc(r.transfer_sequence)}">${esc(r.transfer_sequence)}</a></td>
              <td>${badge(r.state)}</td>
              <td>${rail(r)}</td>
              <td class="mono">${esc(short(r.caller, 6, 4))}</td>
              <td class="num">${assetIn(r)}</td>
              <td class="num mono">${amount(r.eth_out, 18, 6)} <span class="dim">ETH</span></td>
              <td class="num mono">${r.relay_fee ? amount(r.relay_fee, 18, 6) : '<span class="dim">—</span>'}</td>
              <td>${destination(r)}</td>
              <td class="num dim" title="${at(ts)}">${ago(ts)}</td>
            </tr>`;
          })
          .join("");
      }

      async function load() {
        const params = new URLSearchParams({ limit: LIMIT, offset });
        const q = el("q").value.trim();
        const state = el("state").value;
        if (q) params.set("address", q);
        if (state) params.set("state", state);

        const data = (await json(`/api/orders?${params}`)) ?? { items: [], total: 0 };
        render(data.items);
        const from = data.total ? offset + 1 : 0;
        el("count").textContent = `${from}–${Math.min(offset + LIMIT, data.total)} of ${data.total}`;
        el("prev").disabled = offset === 0;
        el("next").disabled = offset + LIMIT >= data.total;
      }

      async function loadStats() {
        const s = await json("/api/status");
        if (!s) return;
        const counts = s.flows?.orders ?? {};
        el("stats").innerHTML = Object.entries(counts)
          .map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`)
          .join("");
      }

      el("prev").onclick = () => {
        offset = Math.max(0, offset - LIMIT);
        load();
      };
      el("next").onclick = () => {
        offset += LIMIT;
        load();
      };
      el("state").onchange = () => {
        offset = 0;
        load();
      };
      let typing;
      el("q").oninput = () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          offset = 0;
          load();
        }, 250);
      };

      // A change anywhere reloads the visible page rather than patching one row — the list is
      // small, ordered by update time, and a stale neighbour is worse than a redraw.
      live("orders", () => {
        if (offset === 0) load();
        loadStats();
      });

      json("/api/tokens").then((t) => {
        if (t) tokens = t;
        load();
      });
      loadStats();
      setInterval(loadStats, 15000);
    </script>
  </body>
</html>
