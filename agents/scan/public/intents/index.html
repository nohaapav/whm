<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hydration intents</title>
    <script>
      try {
        var t = localStorage.getItem("explorer-theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/shared/style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1 class="page-title">Orders <span class="sub" id="subtitle"></span></h1>

      <div class="bar">
        <input
          type="search"
          id="q"
          placeholder="caller, deposit address, or destination recipient"
        />
        <select id="state">
          <option value="">any state</option>
          <option value="placed">placed</option>
          <option value="processed">processed</option>
          <option value="settled">settled</option>
          <option value="refunded">refunded</option>
          <option value="failed">failed</option>
        </select>
      </div>

      <div class="panel">
        <div class="scroll">
          <table class="tbl">
            <thead>
              <tr>
                <th>#</th>
                <th>Time</th>
                <th>From</th>
                <th>To</th>
                <th>Assets</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr>
                <td class="table-error" colspan="6">loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="pager">
          <span class="count" id="count"></span>
          <div class="btns">
            <button id="prev" type="button" title="Newer">←</button>
            <button id="next" type="button" title="Older">→</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module">
      import {
        addrLink,
        ago,
        asset,
        assetIcon,
        chainIcon,
        at,
        badge,
        esc,
        json,
        live,
        topbar,
      } from "/shared/app.js";

      topbar("intents", [
        ["/", "Orders"],
        ["/quotes", "Quotes"],
      ]);

      const LIMIT = 50;
      let offset = 0;
      let tokens = { hydration: {}, dest: {} };

      const el = (id) => document.getElementById(id);

      /**
       * Which chain the user's asset actually landed on, per 1Click's token list. Whatever the
       * quote named — there is no default, so an asset we have no metadata for links nowhere
       * rather than being guessed at.
       */
      const destChain = (r) => tokens.dest[r.dest_asset]?.chain ?? null;

      /**
       * What the order actually did.
       *
       * The user sold an asset on Hydration and received one somewhere else entirely — ETH is only
       * the rail in between, so it does not belong in this column. Until 1Click reports the
       * destination there is nothing to show on the right.
       */
      function assets(r) {
        const inSide = asset(
          r.amount_in,
          tokens.hydration[r.asset_in],
          `#${r.asset_in ?? "?"}`,
          assetIcon(r.asset_in),
        );
        const out = r.dest_amount
          ? asset(
              r.dest_amount,
              tokens.dest[r.dest_asset],
              r.dest_asset ?? "",
              chainIcon(destChain(r)),
            )
          : '<span class="dim">pending</span>';
        return `<span class="assets">${inSide}<span class="arrow">→</span>${out}</span>`;
      }

      /**
       * The order's state, plus the rail's when the rail is what is holding things up. `queued`
       * means the destination rate limiter has the settlement and nothing has been credited.
       */
      function status(r) {
        const rail = r.rail_state === "queued" ? ` ${badge("queued")}` : "";
        return `${badge(r.state)}${rail}`;
      }

      function render(items) {
        if (!items.length) {
          el("rows").innerHTML =
            '<tr><td class="table-error" colspan="6">no orders</td></tr>';
          return;
        }
        el("rows").innerHTML = items
          .map((r) => {
            const ts = r.placed?.blockTimestamp;
            const href = `/orders/${encodeURIComponent(r.transfer_sequence)}`;
            return `<tr class="clickable" data-href="${href}">
              <td class="mono" data-label="#"><a class="link" href="${href}">${esc(r.settlement_sequence ?? "—")}</a></td>
              <td data-label="Time" title="${at(ts)}">${ago(ts)}</td>
              <td class="mono" data-label="From">${addrLink(r.caller, "hydration")}</td>
              <td class="mono" data-label="To">${addrLink(r.dest_address, destChain(r))}</td>
              <td data-label="Assets">${assets(r)}</td>
              <td data-label="Status">${status(r)}</td>
            </tr>`;
          })
          .join("");
      }

      // Whole-row navigation, except where a real link was clicked.
      el("rows").addEventListener("click", (e) => {
        if (e.target.closest("a")) return;
        const href = e.target.closest("tr")?.dataset.href;
        if (href) location.href = href;
      });

      async function load() {
        const params = new URLSearchParams({ limit: LIMIT, offset });
        const q = el("q").value.trim();
        const state = el("state").value;
        if (q) params.set("address", q);
        if (state) params.set("state", state);

        const data = (await json(`/api/orders?${params}`)) ?? {
          items: [],
          total: 0,
        };
        render(data.items);
        const from = data.total ? offset + 1 : 0;
        el("count").textContent =
          `${from}–${Math.min(offset + LIMIT, data.total)} of ${data.total}`;
        el("prev").disabled = offset === 0;
        el("next").disabled = offset + LIMIT >= data.total;
      }

      async function loadSummary() {
        const s = await json("/api/status");
        if (!s) return;
        const counts = s.flows?.orders ?? {};
        el("subtitle").textContent = Object.entries(counts)
          .filter(([, n]) => n > 0)
          .map(([k, n]) => `${n} ${k}`)
          .join(" · ");
      }

      el("prev").onclick = () => {
        offset = Math.max(0, offset - LIMIT);
        load();
      };
      el("next").onclick = () => {
        offset += LIMIT;
        load();
      };
      el("state").onchange = () => {
        offset = 0;
        load();
      };
      let typing;
      el("q").oninput = () => {
        clearTimeout(typing);
        typing = setTimeout(() => {
          offset = 0;
          load();
        }, 250);
      };

      // A change anywhere reloads the visible page rather than patching one row — the list is
      // small, ordered by when the order was placed, and a stale neighbour is worse than a redraw.
      live(
        "orders",
        () => {
          if (offset === 0) load();
          loadSummary();
        },
        () => {
          load();
          loadSummary();
        },
      );

      json("/api/tokens").then((t) => {
        if (t) tokens = t;
        load();
      });
      loadSummary();
      setInterval(loadSummary, 15000);
    </script>
  </body>
</html>
