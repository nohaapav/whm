[toolchain]
# Must match anchor-lang in programs/*/Cargo.toml. Without it the CLI is whatever avm last
# selected globally, and any project pinning another version (hydration-ntt pins 0.29.0) switches it.
anchor_version = "0.32.1"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
oracle-emitter = "AN6yxTepWFFjQWbo4448bNHHQR1Je48ppTkgBEpZ1SoJ"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "ts-mocha -p ./tsconfig.json -t 1000000 test/**/*.ts"

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
dynamic_port_range = "8900-8950"
ledger = ".anchor/test-ledger"
rpc_port = 8898
